version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - cyclop
    - dupl
    - funlen
    - gocognit
    - gocritic
    - gosec
    - lll
    - misspell
    - mnd
    - nestif
    - prealloc
    - staticcheck
    - unconvert
    - whitespace
  settings:
    cyclop:
      max-complexity: 15
      package-average: 10
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
    funlen:
      lines: 80
      statements: 40
    gocritic:
      disabled-checks:
        - commentedOutCode
        - whyNoLint
        - unnamedResult
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
    gosec:
      excludes:
        - G104
      severity: medium
      confidence: medium
    govet:
      enable:
        - shadow
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
        shadow:
          strict: true
    lll:
      line-length: 120
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "10"
        - "100"
        - "1000"
      ignored-files:
        - .*_test.go
    nestif:
      min-complexity: 4
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    testpackage:
      skip-regexp: (export|internal)_test\.go
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop
          - dupl
          - funlen
          - gocognit
          - mnd
        path: _test\.go
      - linters:
          - mnd
        path: main\.go
      - linters:
          - errcheck
          - mnd
        path: examples/
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked
      - path: (.+)\.go$
        text: func name will be used as test\.Test.* by other packages, and that stutters; consider calling this
      - path: (.+)\.go$
        text: should have a package comment, unless it's in another file for this package
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - .*\.pb\.go$
      - vendor
      - tmp
      - .git
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  uniq-by-line: true
  new: false
  fix: false
severity:
  default: error
  rules:
    - linters:
        - dupl
        - mnd
      severity: warning
    - linters:
        - funlen
        - lll
      severity: info
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/lukeweb/k-means-algorithm-go
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - vendor
      - tmp
      - .git
      - third_party$
      - builtin$
      - examples$
